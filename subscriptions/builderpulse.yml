name: builderpulse

source:
  type: github-file
  repo: BuilderPulse/BuilderPulse
  path: "zh/{year}/{date}.md"
  branch: main
  title: BuilderPulse Daily

summary:
  promptFile: prompts/builderpulse.md

# 抓取时把正文图片转存到自有 OSS/CDN 永久保存（OSS 连接信息走环境变量/secrets，
# 见 contributing/image-rehost.md）。
images:
  rehost: true
  format: webp
  quality: 80
  maxWidth: 1600

output:
  obsidian:
    enabled: true
    path: "00_Inbox/Clippings/{date} - BuilderPulse Daily.md"
    frontmatter:
      type: reference
      source: "https://github.com/BuilderPulse/BuilderPulse"
      tags:
        - clipping/builderpulse
        - AI
        - indie-hacker

  notify:
    enabled: true
    summary: true
    channels:
      - wecom
      - feishu

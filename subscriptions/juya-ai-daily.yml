name: juya-ai-daily

source:
  type: rss
  feedUrl: https://daily.juya.uk/rss.xml
  titlePattern: "{date}"
  title: 橘鸦 AI 早报

summary:
  promptFile: prompts/juya-ai-daily.md

# 历史日报的源图床会失效，抓取时把图片转存到自有 OSS/CDN 永久保存。
# OSS 连接信息走环境变量/secrets（见 contributing/image-rehost.md），不入库。
images:
  rehost: true
  format: webp
  quality: 80
  maxWidth: 1600

output:
  obsidian:
    enabled: true
    path: "00_Inbox/Clippings/{date} - 橘鸦 AI 早报.md"
    frontmatter:
      type: reference
      source: "https://daily.juya.uk/"
      tags:
        - clipping/juya-ai-daily
        - AI
        - news

  notify:
    enabled: true
    summary: true
    channels:
      - wecom
      - feishu
